# config/config.yaml
global_settings:
  es_host: "https://localhost:9200"
  alerts_index: "api-alerts-index"
  cron_interval_minutes: 60

apis:
  - api_name: "payment_gateway_v1"
    source_index: "logs-payment-api-*"
    
    # 1. Metrics to Aggregate (Data Layer)
    metrics:
      interval: "15m"
      aggregations:
        - name: "p95_latency"
          field: "response_time_ms"
          type: "percentile"
          percentile: 95
        - name: "error_rate"
          field: "status_code"
          type: "error_percentage"
        - name: "request_count"
          field: "_id"
          type: "count"

    # 2. V2 Ensemble Anomaly Detection (ML + TSFM Layer)
    anomaly_detection:
      enabled: true
      features: ["p95_latency", "error_rate"]
      
      models:
        # Model 1: Statistical (PyOD)
        isolation_forest:
          enabled: true
          contamination: 0.05
          
        # Model 2: Hugging Face TSFM (Amazon Chronos)
        chronos_t5:
          enabled: true
          model_path: "amazon/chronos-t5-small"
          prediction_length: 4 # Predict next 1 hour (4 x 15m buckets)
          
        # Model 3: Hugging Face TSFM (IBM Granite TTM)
        ibm_ttm:
          enabled: true
          model_path: "ibm-granite/granite-timeseries-ttm-v1"
          prediction_length: 4

    # 3. Payload & Drift Detection (DeepDiff & Evidently)
    payload_monitoring:
      enabled: true
      sample_size: 1000
      schema_diff:
        library: "deepdiff"
        ignore_order: true
      drift_detection:
        library: "evidently"
        metric: "population_stability_index"
        target_fields: ["user.account_balance", "transaction.amount"]